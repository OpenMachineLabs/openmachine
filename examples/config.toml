schema_version = 1
# Advisory public-release checks while serving; false disables network checks.
# check_for_updates = false

[machines.local]
transport = "local"
execution_enabled = false
workspace_write_enabled = false

[workspaces.project]
machine = "local"
root = "/absolute/path/to/your/project"

# Optional GitHub connection using the official Open Machine GitHub App.
# Write scopes include reads. Empty scopes grant no repository access.
# Legacy repositories retains exact read/write access; do not mix scope forms.
# [github]
# account = "my-account"
# read_repositories = ["owner/reference"]
# write_repositories = ["owner/project"]
# read_owners = []
# write_owners = []
# attribution = true # Default on; false stops new automatic Created/Posted footers.
# Existing attribution is preserved on edits. See openmachine/skills/github/reference.md#attribution.

# Optional explicit Skill sources; the empty default does not scan user accounts.
[skills]
roots = []

# Optional Linux SSH target. Prepare the worker explicitly and replace its checksum.
# Probe with doctor --machine build, verify the target, then pin ssh_identity.
# [machines.build]
# transport = "ssh"
# ssh_alias = "my-build-host"
# ssh_worker = "/home/alex/.local/share/openmachine/workers/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.pyz"
# execution_enabled = false
# workspace_write_enabled = false
# [workspaces.remote-project]
# machine = "build"
# root = "/home/alex/project"
