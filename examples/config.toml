schema_version = 1
# Local Core settings. OM Cloud account/device approvals are separate.
# Advisory public-release checks while serving; false disables network checks.
# check_for_updates = false

[machines.local]
transport = "local"
# Explicit device authority; never infer it from a registered Workspace.
local_access = "read_only"
# To use native commands or writes, explicitly approve "full_access" instead.
execution_enabled = false
workspace_write_enabled = false

[workspaces.project]
machine = "local"
root = "/absolute/path/to/your/project"

# Optional GitHub connection using the official Open Machine GitHub App.
# Write scopes include reads. Empty scopes grant no repository access.
# Legacy repositories retains exact read/write access; do not mix scope forms.
# [github]
# account = "my-account"
# read_repositories = ["owner/reference"]
# write_repositories = ["owner/project"]
# read_owners = []
# write_owners = []
# Open Machine always adds fixed Created/Posted attribution to new GitHub content.
# There is no attribution setting; existing footers are preserved on edits.

# Optional explicit Skill sources; the empty default does not scan user accounts.
[skills]
roots = []
