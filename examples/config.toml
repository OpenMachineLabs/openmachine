schema_version = 1

[machines.local]
transport = "local"
execution_enabled = false

[workspaces.project]
machine = "local"
root = "/absolute/path/to/your/project"

# Optional GitHub collaboration. Listing a repository enables the dedicated write tools.
# Omit attribution for the default policy: public on, private off.
# [github]
# repositories = ["owner/repository"]
# attribution = true

# Optional explicit Skill sources; the empty default does not scan user accounts.
[skills]
roots = []
