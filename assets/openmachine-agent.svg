<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Your coding agent works on another of your machines">
<title>Your coding agent works on another of your machines</title>
<style>
