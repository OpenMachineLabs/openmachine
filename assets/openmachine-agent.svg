<text class="mono" x="68" y="160" fill="#6a6a6a" font-size="12" letter-spacing="2">YOU</text>
<text x="68" y="190" fill="#f4f4f4" font-size="18">Train the model on the GPU server, then open a pull request with the results.</text></g>
<g class="a2"><circle cx="72" cy="244" r="11" fill="none" stroke="#3fb950" stroke-width="2"/><path d="M66 244l4 4 7-8" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="250" fill="#f4f4f4" font-size="20" font-weight="600">Reach the GPU server</text></g>
<text class="mono a3" x="96" y="280" fill="#9a9a9a" font-size="17">$ ssh gpu-train-01.om</text>
<text class="mono a4" x="96" y="306" fill="#3fb950" font-size="17">Connected · Selected projects</text>
<g class="a5"><circle cx="72" cy="346" r="11" fill="none" stroke="#3fb950" stroke-width="2"/><path d="M66 346l4 4 7-8" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="352" fill="#f4f4f4" font-size="20" font-weight="600">Train the model there</text></g>
<text class="mono a6" x="96" y="382" fill="#9a9a9a" font-size="17">gpu-train-01 $ python train.py --epochs 3</text>
<g class="a6"><rect x="96" y="398" width="420" height="8" rx="4" fill="#232323"/><rect class="bar" x="96" y="398" width="420" height="8" rx="4" fill="#d9774f"/></g>
<text class="mono a7" x="96" y="432" fill="#3fb950" font-size="17">epoch 3/3 · loss 0.214 · checkpoint saved</text>
<g class="a8"><circle cx="72" cy="472" r="11" fill="none" stroke="#3fb950" stroke-width="2"/><path d="M66 472l4 4 7-8" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="478" fill="#f4f4f4" font-size="20" font-weight="600">Open a pull request</text></g>
<text class="mono a9" x="96" y="508" fill="#9a9a9a" font-size="17">$ git push origin train-run</text>
<text class="mono a10" x="96" y="534" fill="#3fb950" font-size="17">Pull request #42 opened · results attached</text>
<rect x="48" y="562" width="704" height="38" rx="9" fill="#171717" stroke="#262626"/>
<text x="66" y="587" fill="#6a6a6a" font-size="15">Ask a follow-up…</text><rect class="cursor" x="196" y="572" width="2" height="18" fill="#9a9a9a"/>
<rect x="796" y="24" width="380" height="592" rx="14" fill="#121212" stroke="#262626"/>
<text class="mono" x="820" y="62" fill="#6a6a6a" font-size="12" letter-spacing="2">YOUR MACHINES</text>
<text x="1152" y="62" fill="#3fb950" font-size="13" text-anchor="end">3 connected</text>
<rect x="808" y="174" width="352" height="76" rx="10" fill="#161616" stroke="#262626"/><text x="830" y="208" fill="#f4f4f4" font-size="18" font-weight="600">MacBook Pro</text><text x="830" y="234" fill="#6a6a6a" font-size="14">This machine</text><circle cx="1130" cy="212" r="5" fill="#3fb950"/><rect x="808" y="266" width="352" height="76" rx="10" fill="#161616" stroke="#262626"/><text x="830" y="300" fill="#f4f4f4" font-size="18" font-weight="600">gpu-train-01</text><text x="830" y="326" fill="#6a6a6a" font-size="14">8× GPU · Training</text><circle cx="1130" cy="304" r="5" fill="#3fb950"/><g class="m1"><rect x="806" y="264" width="356" height="80" rx="11" fill="none" stroke="#d9774f" stroke-width="2"/><rect x="1018" y="290" width="98" height="26" rx="13" fill="#2a1a12"/><text x="1067" y="308" fill="#d9774f" font-size="13" text-anchor="middle" font-weight="600">In session</text><circle class="pulse" cx="1130" cy="304" r="10" fill="none" stroke="#3fb950"/></g><rect x="808" y="358" width="352" height="76" rx="10" fill="#161616" stroke="#262626"/><text x="830" y="392" fill="#f4f4f4" font-size="18" font-weight="600">build-server</text><text x="830" y="418" fill="#6a6a6a" font-size="14">Linux · CI</text><circle cx="1130" cy="396" r="5" fill="#3fb950"/>
<text x="986" y="560" fill="#6a6a6a" font-size="14" text-anchor="middle">Every machine you own, one sign-in.</text>
