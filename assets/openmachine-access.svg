<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-label="Power under your control">
<title>Power under your control</title>
<style>
text{font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
@keyframes s0{0%,0.00%{opacity:0}2.00%,31.33%{opacity:1}33.33%,100%{opacity:0}}
.s0{opacity:0;animation:s0 12s ease-in-out infinite}
@keyframes s1{0%,33.32%{opacity:0}35.33%,64.67%{opacity:1}66.67%,100%{opacity:0}}
.s1{opacity:0;animation:s1 12s ease-in-out infinite}
@keyframes s2{0%,66.66%{opacity:0}68.67%,98.00%{opacity:1}100.00%,100%{opacity:0}}
.s2{opacity:0;animation:s2 12s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.s0{animation:none;opacity:1}}
</style>
<rect width="1600" height="620" fill="#0b0b0b" rx="20"/>
<text class="mono" x="60" y="66" fill="#6a6a6a" font-size="15" letter-spacing="3">MACHINE ACCESS</text>
<rect x="60" y="100" width="860" height="460" rx="16" fill="#121212" stroke="#262626"/>
<text x="92" y="150" fill="#f4f4f4" font-size="24" font-weight="700">Permissions</text>
<text x="92" y="180" fill="#9a9a9a" font-size="16">Choose how far your agent can reach on each machine.</text><rect x="92" y="230" width="796" height="84" rx="12" fill="#161616" stroke="#262626"/><g class="s0"><rect x="90" y="228" width="800" height="88" rx="13" fill="none" stroke="#3fb950" stroke-width="2"/></g><text x="120" y="268" fill="#f4f4f4" font-size="20" font-weight="600">MacBook Pro</text><text x="120" y="294" fill="#6a6a6a" font-size="15">Development</text><rect x="668" y="254" width="180" height="36" rx="18" fill="#10261a"/><text x="758" y="278" fill="#3fb950" font-size="16" font-weight="600" text-anchor="middle">Full access</text><rect x="92" y="334" width="796" height="84" rx="12" fill="#161616" stroke="#262626"/><g class="s1"><rect x="90" y="332" width="800" height="88" rx="13" fill="none" stroke="#d9774f" stroke-width="2"/></g><text x="120" y="372" fill="#f4f4f4" font-size="20" font-weight="600">Build server</text><text x="120" y="398" fill="#6a6a6a" font-size="15">Automation</text><rect x="668" y="358" width="180" height="36" rx="18" fill="#2a1a12"/><text x="758" y="382" fill="#d9774f" font-size="16" font-weight="600" text-anchor="middle">Selected projects</text><rect x="92" y="438" width="796" height="84" rx="12" fill="#161616" stroke="#262626"/><g class="s2"><rect x="90" y="436" width="800" height="88" rx="13" fill="none" stroke="#8ab4f8" stroke-width="2"/></g><text x="120" y="476" fill="#f4f4f4" font-size="20" font-weight="600">GPU cluster</text><text x="120" y="502" fill="#6a6a6a" font-size="15">Training</text><rect x="668" y="462" width="180" height="36" rx="18" fill="#14202e"/><text x="758" y="486" fill="#8ab4f8" font-size="16" font-weight="600" text-anchor="middle">Read only</text><rect x="960" y="100" width="580" height="460" rx="16" fill="#121212" stroke="#262626"/><g class="s0"><text class="mono" x="996" y="160" fill="#6a6a6a" font-size="13" letter-spacing="2">MACBOOK PRO</text><text x="996" y="230" fill="#3fb950" font-size="40" font-weight="700">Full access</text><text x="996" y="290" fill="#f4f4f4" font-size="24">Your agent works as you do on this</text><text x="996" y="326" fill="#f4f4f4" font-size="24">machine.</text><text x="996" y="520" fill="#9a9a9a" font-size="16">Change it any time; it applies to the next session.</text></g><g class="s1"><text class="mono" x="996" y="160" fill="#6a6a6a" font-size="13" letter-spacing="2">BUILD SERVER</text><text x="996" y="230" fill="#d9774f" font-size="40" font-weight="700">Selected projects</text><text x="996" y="290" fill="#f4f4f4" font-size="24">Your agent changes only the</text><text x="996" y="326" fill="#f4f4f4" font-size="24">projects you pick. Keys and other</text><text x="996" y="362" fill="#f4f4f4" font-size="24">apps' data stay out of reach.</text><text x="996" y="520" fill="#9a9a9a" font-size="16">Change it any time; it applies to the next session.</text></g><g class="s2"><text class="mono" x="996" y="160" fill="#6a6a6a" font-size="13" letter-spacing="2">GPU CLUSTER</text><text x="996" y="230" fill="#8ab4f8" font-size="40" font-weight="700">Read only</text><text x="996" y="290" fill="#f4f4f4" font-size="24">Your agent can look around, build</text><text x="996" y="326" fill="#f4f4f4" font-size="24">and test, but never changes your</text><text x="996" y="362" fill="#f4f4f4" font-size="24">files.</text><text x="996" y="520" fill="#9a9a9a" font-size="16">Change it any time; it applies to the next session.</text></g>
</svg>
