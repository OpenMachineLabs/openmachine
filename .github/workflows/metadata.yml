name: metadata

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check current event metadata without code verification
        run: python3 scripts/check_repository.py --mode metadata
