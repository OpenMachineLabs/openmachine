name: quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      linux_native:
        description: Build an unsigned Ubuntu payload and test an isolated native user service
        type: boolean
        default: false

permissions:
  contents: read

# Metadata edits cannot cancel a code candidate, even when both concern the same PR.
concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'code' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Required checks must report on all PR events, including metadata-only edits.
jobs:
  repository:
    name: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check candidate source and push commit metadata
        run: python3 scripts/check_repository.py --mode source

  runtime:
    needs: repository
    name: runtime
    runs-on: ubuntu-24.04
    # The pinned full installed-wheel suite can exceed five minutes on CI runners.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Python with supported SQLite
        run: |
          curl --fail --location --retry 2 --retry-max-time 60 --max-time 60 \
            https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.13.16%2B20261003-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz \
            --output "$RUNNER_TEMP/om-python.tar.gz"
          echo "4595c5589fff7bf0cb158d9a88a797e0d791fa33830770fcb7bf3f4b104feeae  $RUNNER_TEMP/om-python.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/om-python"
          tar -xzf "$RUNNER_TEMP/om-python.tar.gz" -C "$RUNNER_TEMP/om-python"
          echo "$RUNNER_TEMP/om-python/python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/om-python/python/bin/python3" -I -c 'import sqlite3, sys; print(sys.version); print("SQLite", sqlite3.sqlite_version); assert sqlite3.sqlite_version_info == (3, 53, 1)'
      - name: Verify the exact candidate with its required test layers
        run: python3 scripts/premerge.py --ci --force

  linux-native:
    if: (github.event_name == 'pull_request' && github.event.action != 'edited') || (github.event_name == 'workflow_dispatch' && inputs.linux_native)
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps: &linux_native_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build the exact unsigned local payload
        run: |
          python3 -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install -r requirements.lock
          "$RUNNER_TEMP/build/bin/python" -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
          "$RUNNER_TEMP/build/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheels/*.whl
          "$RUNNER_TEMP/build/bin/python" scripts/build_runtime_payload.py \
            --wheel "$RUNNER_TEMP"/wheels/*.whl --requirements "$GITHUB_WORKSPACE/requirements.lock" \
            --commit "$(git rev-parse HEAD)" --cache "$RUNNER_TEMP/inputs" --output "$RUNNER_TEMP/payload"
      - name: Exercise only a disposable account and its native unit
        run: |
          sudo useradd --create-home --shell /bin/bash om-linux-test
          touch "$RUNNER_TEMP/om-user-created"
          test_uid=$(id -u om-linux-test)
          sudo cp -a "$RUNNER_TEMP/payload" /home/om-linux-test/payload
          sudo cp -a test /home/om-linux-test/test
          sudo chown -R om-linux-test:om-linux-test /home/om-linux-test
          # Only this disposable user manager gets the offline/no-toolchain sandbox.
          # The runner and its build/upload tools are outside these namespaces.
          dropin="/run/systemd/system/user@$test_uid.service.d"
          sudo mkdir "$dropin"
          {
            echo '[Service]'
            echo 'Environment=HOME=/home/om-linux-test XDG_CONFIG_HOME=/home/om-linux-test/.config'
            echo 'Environment=XDG_DATA_HOME=/home/om-linux-test/.local/share XDG_CACHE_HOME=/home/om-linux-test/.cache'
            echo 'PrivateNetwork=yes'
            printf 'InaccessiblePaths=-/usr/local -/opt'
            for tool in /usr/bin/python* /usr/bin/pip* /usr/bin/git* /usr/bin/node* \
                        /usr/bin/npm /usr/bin/npx /usr/bin/rustc /usr/bin/cargo \
                        /usr/bin/cc /usr/bin/gcc* /usr/bin/g++* /usr/bin/clang*; do
              printf ' -%s' "$tool"
            done
            printf '\n'
          } | sudo tee "$dropin/acceptance.conf"
          sudo systemctl daemon-reload
          sudo systemctl start "user@$test_uid.service"
          sudo -u om-linux-test mkdir -m 700 /home/om-linux-test/evidence
          manifest_sha=$(sha256sum /home/om-linux-test/payload/manifest.json | cut -d ' ' -f 1)
          sudo -u om-linux-test env -i HOME=/home/om-linux-test XDG_RUNTIME_DIR="/run/user/$test_uid" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$test_uid/bus" PATH=/usr/bin:/bin \
            /usr/bin/systemd-run --user --wait --pipe --collect --unit=om-native-acceptance \
            --setenv=HOME=/home/om-linux-test --setenv=PATH=/usr/bin:/bin \
            --setenv=OM_NATIVE_FIRST_USE=1 --setenv=OM_NATIVE_DISPOSABLE_USER="$test_uid" \
            --setenv=OM_NATIVE_SANDBOX=1 --setenv=OM_NATIVE_EVIDENCE=/home/om-linux-test/evidence/first-use.json \
            --setenv=OM_NATIVE_PAYLOAD=/home/om-linux-test/payload --setenv=OM_NATIVE_PAYLOAD_SHA256="$manifest_sha" \
            /home/om-linux-test/payload/python/bin/python3 -I -B -c \
            'import os,sys,unittest; os.chdir("/home/om-linux-test"); sys.path.insert(0,os.getcwd()); unittest.main(module=None, argv=["native", "test.resilience.service.test_maintenance_process.NativeFirstUseTests"])'
      - name: Retain the exact unsigned candidate and native diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/linux-evidence"
          if test -f "$RUNNER_TEMP/payload/manifest.json"; then
            cp "$RUNNER_TEMP/payload/manifest.json" "$RUNNER_TEMP/linux-evidence/manifest.json"
            sha256sum "$RUNNER_TEMP/payload/manifest.json" | tee "$RUNNER_TEMP/linux-evidence/manifest.sha256"
            tar -czf "$RUNNER_TEMP/linux-evidence/runtime-linux-gnu-x86_64.tar.gz" -C "$RUNNER_TEMP" payload
            sha256sum "$RUNNER_TEMP/linux-evidence/runtime-linux-gnu-x86_64.tar.gz" > "$RUNNER_TEMP/linux-evidence/archive.sha256"
          fi
          if test -f "$RUNNER_TEMP/om-user-created"; then
            test_uid=$(id -u om-linux-test)
            sudo journalctl --no-pager -b "_UID=$test_uid" --lines=300 > "$RUNNER_TEMP/linux-evidence/journal.txt"
            if sudo test -f /home/om-linux-test/evidence/first-use.json; then
              sudo cat /home/om-linux-test/evidence/first-use.json > "$RUNNER_TEMP/linux-evidence/first-use.json"
              cat "$RUNNER_TEMP/linux-evidence/first-use.json"
            fi
            sudo systemctl cat "user@$test_uid.service" > "$RUNNER_TEMP/linux-evidence/user-manager.txt"
          fi
      - name: Upload unsigned candidate evidence, not a public release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-linux-native-${{ github.job }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/linux-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Remove only the disposable account and its remaining processes
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/om-user-created"; then
            test_uid=$(id -u om-linux-test)
            sudo systemctl stop "user@$test_uid.service"
            # The stopped manager has already removed its login record.
            test "$(sudo systemctl show "user@$test_uid.service" -p ActiveState --value)" = inactive
            sudo userdel --remove om-linux-test
          fi

  # Keep the original required check; run the same isolated native fixture
  # on the oldest and newest supported Ubuntu LTS GitHub-hosted runners.
  linux-native-ubuntu-22:
    if: (github.event_name == 'pull_request' && github.event.action != 'edited') || (github.event_name == 'workflow_dispatch' && inputs.linux_native)
    needs: repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps: *linux_native_steps

  linux-native-ubuntu-26:
    if: (github.event_name == 'pull_request' && github.event.action != 'edited') || (github.event_name == 'workflow_dispatch' && inputs.linux_native)
    needs: repository
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps: *linux_native_steps
