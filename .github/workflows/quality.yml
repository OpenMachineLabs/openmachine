name: quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Metadata edits cannot cancel a code candidate, even when both concern the same PR.
concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'code' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Required checks must report on all PR events, including metadata-only edits.
jobs:
  repository:
    name: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check candidate source and push commit metadata
        run: python3 scripts/check_repository.py --mode source

  runtime:
    needs: repository
    name: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify the exact candidate with its required test layers
        run: python3 scripts/premerge.py --ci --force

  # The Go network module builds and tests on its own, apart from the Python package.
  connector:
    name: connector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: Build and vet for Linux and macOS
        run: |
          test -z "$(gofmt -l .)"
          go build ./...
          go vet ./...
          GOOS=darwin go vet ./...
      - name: Third-party license list matches the build graph
        run: |
          # Native macOS builds use cgo; list that graph on any host.
          for os in linux darwin; do
            CGO_ENABLED=1 GOOS=$os go list -deps -f '{{with .Module}}{{if not .Main}}{{.Path}} {{.Version}}{{end}}{{end}}' .
          done | sort -u > "$RUNNER_TEMP/graph"
          sed -nE 's/^- `([^`]+)` ([^ ]+) .*/\1 \2/p' THIRD_PARTY_LICENSES.md | diff - "$RUNNER_TEMP/graph"
      - name: Install pinned Headscale and DERP
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/juanfont/headscale/cmd/headscale@v0.29.7
          GOBIN="$RUNNER_TEMP/bin" go install "tailscale.com/cmd/derper@$(go list -m -f '{{.Version}}' tailscale.com)"
      - name: Test, including the network proof
        env:
          OM_HEADSCALE: ${{ runner.temp }}/bin/headscale
          OM_DERPER: ${{ runner.temp }}/bin/derper
        run: go test -count=1 -v ./...
