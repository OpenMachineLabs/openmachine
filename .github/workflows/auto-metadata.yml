name: fill issue and PR metadata

on:
  issues:
    types: [opened, edited, reopened, closed]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: auto-metadata-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  metadata:
    # Run only trusted main-branch code, never code from an incoming PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Fill missing labels and assignees
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/auto_metadata.py
