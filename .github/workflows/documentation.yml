name: documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.lock
      - .github/workflows/documentation.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.lock
      - .github/workflows/documentation.yml
  workflow_dispatch:

permissions:
  contents: read

# Metadata edits must not cancel a candidate check or an in-flight deployment.
concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: documentation-build
    permissions:
      contents: read
      pages: read
    runs-on: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CORE_CI_RUNNER || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install documentation-only dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.lock
      - name: Read the administrator-enabled Pages base URL
        id: pages
        if: github.repository == 'OpenMachineLabs/openmachine' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES_ENABLED == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Build and validate every guide
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 7
      - name: Report build-only status
        if: vars.DOCS_PAGES_ENABLED != 'true'
        run: echo 'Static site built and uploaded. Pages deployment is disabled. A successful build is not a published website.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: documentation-deploy
    needs: build
    if: github.repository == 'OpenMachineLabs/openmachine' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
