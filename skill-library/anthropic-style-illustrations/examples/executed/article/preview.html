th fits this input?</tspan></text><rect x="600.0" y="270.5" width="548.0" height="59" rx="3" fill="#ffffff" stroke="none"/><text x="616.0" y="300.5" font-family="sans-serif" font-size="18" font-weight="400" fill="#172b3a"><tspan x="616.0" dy="0">Which work can proceed concurrently?</tspan></text><rect x="48.0" y="335.5" width="548.0" height="86" rx="3" fill="#e7eff6" stroke="none"/><text x="64.0" y="365.5" font-family="sans-serif" font-size="18" font-weight="400" fill="#172b3a"><tspan x="64.0" dy="0">Read the routing section for conditions.</tspan></text><rect x="600.0" y="335.5" width="548.0" height="86" rx="3" fill="#e7eff6" stroke="none"/><text x="616.0" y="365.5" font-family="sans-serif" font-size="18" font-weight="400" fill="#172b3a"><tspan x="616.0" dy="0">Read the parallelization section for</tspan><tspan x="616.0" dy="26.099999999999998">conditions.</tspan></text><rect x="48" y="463.5" width="1104" height="2" rx="0" fill="#e7eff6" stroke="none"/><text x="48" y="498.5" font-family="sans-serif" font-size="17" font-weight="400" fill="#172b3a"><tspan x="48" dy="0">An original reading map based on workflow names. The source article supplies the actual usage</tspan><tspan x="48" dy="24.65">conditions; this comparison does not rank performance.</tspan></text><text x="48" y="559.8" font-family="sans-serif" font-size="13" font-weight="400" fill="#516374"><tspan x="48" dy="0">Reference context: Building effective agents</tspan></text></svg><ul><li><a href="https://www.anthropic.com/engineering/building-effective-agents">https://www.anthropic.com/engineering/building-effective-agents</a></li></ul></html>
