<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="593" viewBox="0 0 1200 593" role="img" aria-labelledby="title description"><title id="title">What the local corpus contains</title><desc id="description">What the local corpus contains</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#176b91"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fc"/><rect x="48" y="32" width="58" height="6" rx="3" fill="#087f78" stroke="none"/><text x="48" y="88" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b3a"><tspan x="48" dy="0">What the local corpus contains</tspan></text><text x="48" y="138.4" font-family="sans-serif" font-size="18" font-weight="400" fill="#516374"><tspan x="48" dy="0">Original explanatory composition</tspan></text><text x="48" y="227.5" font-family="sans-serif" font-size="17" font-weight="400" fill="#172b3a"><tspan x="48" dy="0">Source publications</tspan></text><rect x="340" y="214.5" width="630.0" height="24" rx="3" fill="#087f78" stroke="none"/><text x="984" y="227.5" font-family="sans-serif" font-size="17" font-weight="400" fill="#172b3a"><tspan x="984" dy="0">850 documents</tspan></text><text x="48" y="281.5" font-family="sans-serif" font-size="17" font-weight="400" fill="#172b3a"><tspan x="48" dy="0">Supporting literature</tspan></text><rect x="340" y="268.5" width="45.95294117647059" height="24" rx="3" fill="#176b91" stroke="none"/><text x="984" y="281.5" font-family="sans-serif" font-size="17" font-weight="400" fill="#172b3a"><tspan x="984" dy="0">62 documents</tspan></text><text x="48" y="335.5" font-family="sans-serif" font-size="17" font-weight="400" fill="#172b3a"><tspan x="48" dy="0">Landing pages</tspan></text><rect x="340" y="322.5" width="0.7411764705882352" height="24" rx="3" fill="#087f78" stroke="none"/><text x="984" y="335.5" font-family="sans-serif" font-size="17" font-weight="400" fill="#172b3a"><tspan x="984" dy="0">1 documents</tspan></text><text x="340" y="389.5" font-family="sans-serif" font-size="15" font-weight="400" fill="#516374"><tspan x="340" dy="0">0 • Shared zero baseline</tspan></text><rect x="48" y="442.5" width="1104" height="2" rx="0" fill="#e7eff6" stroke="none"/><text x="48" y="477.5" font-family="sans-serif" font-size="17" font-weight="400" fill="#172b3a"><tspan x="48" dy="0">Counts computed from the retained articles index. Supporting literature and landing pages are</tspan><tspan x="48" dy="24.65">excluded from default style retrieval.</tspan></text><text x="48" y="538.8" font-family="sans-serif" font-size="13" font-weight="400" fill="#516374"><tspan x="48" dy="0">Reference context: Building effective agents</tspan></text></svg>