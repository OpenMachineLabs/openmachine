ake → Parts reviewer: request review</tspan><tspan x="48" dy="21.75">Safety reviewer → Coordinator: return safety note</tspan><tspan x="48" dy="21.75">Parts reviewer → Coordinator: return parts note</tspan><tspan x="48" dy="21.75">Coordinator → Intake: request clarification</tspan></text><rect x="48" y="787.25" width="1104" height="2" rx="0" fill="#e7eff6" stroke="none"/><text x="48" y="822.25" font-family="sans-serif" font-size="17" font-weight="400" fill="#172b3a"><tspan x="48" dy="0">A proposed human workflow: both reviews inform coordination, and incomplete requests return to</tspan><tspan x="48" dy="24.65">intake. Arrows encode information handoffs; no timing or success rate is implied.</tspan></text><text x="48" y="883.55" font-family="sans-serif" font-size="13" font-weight="400" fill="#516374"><tspan x="48" dy="0">Reference context: Building effective agents</tspan></text></svg><ul><li><a href="https://www.anthropic.com/engineering/building-effective-agents">https://www.anthropic.com/engineering/building-effective-agents</a></li></ul></html>
