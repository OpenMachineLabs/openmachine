<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:"><title>Three exchanges, three contracts</title><style>body{margin:0;background:#e7eff6;padding:24px}svg{width:100%;height:auto;max-width:1200px;display:block;margin:auto}</style><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="641" viewBox="0 0 1200 641" role="img" aria-labelledby="title description"><title id="title">Three exchanges, three contracts</title><desc id="description">Three aligned columns distinguish selecting one handler, combining contributions and returning critique before acceptance.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#436c59"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="48" y="32" width="58" height="6" rx="3" fill="#286b4b" stroke="none"/><text x="48" y="88" font-family="sans-serif" font-size="32" font-weight="700" fill="#213a30"><tspan x="48" dy="0">Three exchanges, three contracts</tspan></text><text x="48" y="138.4" font-family="sans-serif" font-size="18" font-weight="400" fill="#52665b"><tspan x="48" dy="0">Original explanatory design • No performance measurements</tspan></text><rect x="48.0" y="202.5" width="364.0" height="60" rx="4" fill="#213a30" stroke="none"/><text x="64.0" y="233.5" font-family="sans-serif" font-size="19" font-weight="700" fill="#ffffff"><tspan x="64.0" dy="0">Choose</tspan></text><rect x="416.0" y="202.5" width="364.0" height="60" rx="4" fill="#213a30" stroke="none"/><text x="432.0" y="233.5" font-family="sans-serif" font-size="19" font-weight="700" fill="#ffffff"><tspan x="432.0" dy="0">Combine</tspan></text><rect x="784.0" y="202.5" width="364.0" height="60" rx="4" fill="#213a30" stroke="none"/><text x="800.0" y="233.5" font-family="sans-serif" font-size="19" font-weight="7 ring nor guaranteed improvement.</tspan></text><text x="48" y="586.8" font-family="sans-serif" font-size="13" font-weight="400" fill="#52665b"><tspan x="48" dy="0">Reference context: Building effective agents</tspan></text></svg><ul><li><a href="https://www.anthropic.com/engineering/building-effective-agents">https://www.anthropic.com/engineering/building-effective-agents</a></li></ul></html>
