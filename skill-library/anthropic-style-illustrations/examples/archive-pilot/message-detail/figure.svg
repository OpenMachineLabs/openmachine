<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="576" viewBox="0 0 1200 576" role="img" aria-labelledby="title description"><title id="title">Make an unfinished record recoverable</title><desc id="description">Matched messages contrast an unexplained publication failure with a proposed message preserving the record ID, restricted status, unresolved display basis and next reviewer action.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3b5b8a"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="48" y="32" width="58" height="6" rx="3" fill="#466966" stroke="none"/><text x="48" y="88" font-family="sans-serif" font-size="32" font-weight="700" fill="#202630"><tspan x="48" dy="0">Make an unfinished record recoverable</tspan></text><text x="48" y="138.4" font-family="sans-serif" font-size="18" font-weight="400" fill="#555d69"><tspan x="48" dy="0">Matched state • Illustrative record identifier</tspan></text><rect x="48.0" y="202.5" width="548.0" height="60" rx="4" fill="#202630" stroke="none"/><text x="64.0" y="233.5" font-family="sans-serif" font-size="19" font-weight="700" fill="#ffffff"><tspan x="64.0" dy="0">Missing recovery information</tspan></text><rect x="600.0" y="202.5" width="548.0" height="60" rx="4" fill="#202630" stroke="none"/><text x="616.0" y="233.5" font-family="sans-serif" font-size="19" font-weight="700" fill="#ffffff"><tspan x="616.0" dy="0">Original proposed response</tspan></text><rect x="48.0" y="270.5" width="548.0" height="113" rx="3" fill="#ffffff" stroke="none"/><text x="64.0" y="300.5" font-family="sans-serif" font-size="18" font-weight="400" fill="#202630"><tspan x="64.0" dy="0">Unable to publish.</tspan></text><rect x="600.0" y="270.5" width="548.0" height="113" rx="3" fill="#ffffff" stroke="none"/><text x="616.0" y="300.5" font-family="sans-serif" font-size="18" font-weight="400" fill="#202630"><tspan x="616.0" dy="0">Record PHOTO-014 remains restricted. The</tspan><tspan x="616.0" dy="26.099999999999998">display basis is unresolved. Ask the</tspan><tspan x="616.0" dy="26.099999999999998">permissions reviewer to complete the note.</tspan></text><rect x="48" y="425.5" width="1104" height="2" rx="0" fill="#edf0f3" stroke="none"/><text x="48" y="460.5" font-family="sans-serif" font-size="17" font-weight="400" fill="#202630"><tspan x="48" dy="0">Both messages describe the same hypothetical incomplete record. The longer response names the</tspan><tspan x="48" dy="24.65">state, missing evidence and next action. It does not invent permission.</tspan></text><text x="48" y="521.8" font-family="sans-serif" font-size="13" font-weight="400" fill="#555d69"><tspan x="48" dy="0">Reference context: Writing tools for agents</tspan></text></svg>