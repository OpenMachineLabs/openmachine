<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:"><title>Two notes, one accountable decision</title><style>body{margin:0;background:#e7eff6;padding:24px}svg{width:100%;height:auto;max-width:1200px;display:block;margin:auto}</style><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="938" viewBox="0 0 1200 938" role="img" aria-labelledby="title description"><title id="title">Two notes, one accountable decision</title><desc id="description">Intake sends the same identifier to two independent reviewers. Both notes reach an editor. A separate outside lane returns a specific unresolved question to intake.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3b5b8a"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="48" y="32" width="58" height="6" rx="3" fill="#466966" stroke="none"/><text x="48" y="88" font-family="sans-serif" font-size="32" font-weight="700" fill="#202630"><tspan x="48" dy="0">Two notes, one accountable decision</tspan></text><text x="48" y="138.4" font-family="sans-serif" font-size="18" font-weight="400" fill="#555d69"><tspan x="48" dy="0">Original explanatory design • No performance measurements</tspan></text><polyline points="368.0,255.5 404.0,255.5 404.0,255.5 440.0,255.5" fill="none" stroke="#3b5b8a" stroke-width="2.5"/><polygon points="440.0,255.5 430.0,250.5 430.0,260.5" fill="#3b5b8a"/><polyline points="368.0,255.5 404.0,255.5 404.0,445.5 440.0,445.5" fill="none" stroke="#3b5b8a" stroke-width="2.5"/><polygon points="440.0,445.5 430.0,440.5 430.0,450.5" fill="#3b5b8a"/><polyline points="760.0,255.5 796.0,255.5 796.0,255.5 832.0,255.5" fill="none" stroke="#3b5b8a" stroke-width="2.5"/><polygon points="832.0,255.5 822.0,250.5 822.0,260.5" fill="#3b5b8a"/><polyline points="760.0,445.5 796.0,445.5 796.0,255.5 832.0,255.5" fill="none" stroke="#3b5b8a" stroke-width="2.5"/><polygon points="832.0,255.5 822.0,250.5 822.0,260.5" fill="#3b5b8a"/><polyline points="1152.0,255.5 1172.0,255.5 1172.0,618.5 28.0,618.5 28.0,255.5 48.0,255.5" fill="none" stroke="#3b5b8a" stroke-width="2.5"/><polygon points="48.0,255.5 38.0,250.5 38.0,260.5" fill="#3b5b8a"/><rect x="48.0" y="202.5" width="320.0" height="106" rx="12" fill="#ffffff" stroke="#edf0f3"/><rect x="48.0" y="202.5" width="5" height="106" rx="2" fill="#466966" stroke="none"/><text x="64.0" y="240.5" font-family="sans-serif" font-size="18" font-weight="600" fill="#202630"><tspan x="64.0" dy="0">Intake • Object ID</tspan></text><rect x="440.0" y="202.5" width="320.0" height="106" rx="12" fill="#ffffff" stroke="#edf0f3"/><rect x="440.0" y="202.5" width="5" height="106" rx="2" fill="#3b5b8a" stroke="none"/><text x="456.0" y="240.5" font-family="sans-serif" font-size="18" font-weight="600" fill="#202630"><tspan x="456.0" dy="0">Description • Identity</tspan><tspan x="456.0" dy="26.099999999999998">note</tspan></text><rect x="440.0" y="392.5" width="320.0" height="106" rx="12" fill="#ffffff" stroke="#edf0f3"/><rect x="440.0" y="392.5" width="5" height="106" rx="2" fill="#466966" stroke="none"/><text x="456.0" y="430.5" font-family="sans-serif" font-size="18" font-weight="600" fill="#202630"><tspan x="456.0" dy="0">Permissions • Display</tspan><tspan x="456.0" dy="26.099999999999998">basis</tspan></text><rect x="832.0" y="202.5" width="320.0" height="106" rx="12" fill="#ffffff" stroke="#edf0f3"/><rect x="832.0" y="202.5" width="5" height="106" rx="2" fill="#3b5b8a" stroke="none"/><text x="848.0" y="240.5" font-family="sans-serif" font-size="18" font-weight="600" fill="#202630"><tspan x="848.0" dy="0">Editor • Reconcile both</tspan><tspan x="848.0" dy="26.099999999999998">notes</tspan></text><text x="48" y="657.5" font-family="sans-serif" font-size="15" font-weight="400" fill="#555d69"><tspan x="48" dy="0">Intake → Description: same object ID and description</tspan><tspan x="48" dy="21.75">Intake → Permissions: same object ID and description</tspan><tspan x="48" dy="21.75">Description → Editor: identity note</tspan><tspan x="48" dy="21.75">Permissions → Editor: permissions note</tspan><tspan x="48" dy="21.75">Editor → Intake: specific unresolved question</tspan></text><rect x="48" y="787.25" width="1104" height="2" rx="0" fill="#edf0f3" stroke="none"/><text x="48" y="822.25" font-family="sans-serif" font-size="17" font-weight="400" fill="#202630"><tspan x="48" dy="0">Proposed workflow. Arrows carry requests or notes, not elapsed time. The editor may approve</tspan><tspan x="48" dy="24.65">with stated uncertainty, restrict the record or defer; repetition does not guarantee approval.</tspan></text><text x="48" y="883.55" font-family="sans-serif" font-size="13" font-weight="400" fill="#555d69"><tspan x="48" dy="0">Reference context: Building effective agents ; Petri</tspan></text></svg><ul><li><a href="https://www.anthropic.com/engineering/building-effective-agents">https://www.anthropic.com/engineering/building-effective-agents</a></li><li><a href="https://alignment.anthropic.com/2025/petri/">https://alignment.anthropic.com/2025/petri/</a></li></ul></html>
