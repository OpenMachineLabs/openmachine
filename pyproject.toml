[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openmachine"
dynamic = ["version"]
description = "Your AI. Your machines. Let your coding agent work on every machine you own, with the access you choose."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic==2.13.5"]

[tool.hatch.build.targets.wheel]
packages = ["openmachine"]

[tool.hatch.version]
path = "openmachine/__init__.py"
