[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openmachine-access"
dynamic = ["version"]
description = "Your AI. Your machines. Let your coding agent work on every machine you own, with the access you choose."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic==2.13.5"]

[tool.hatch.build.targets.wheel]
packages = ["access/openmachine_access"]

[tool.hatch.version]
path = "access/openmachine_access/__init__.py"
