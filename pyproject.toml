[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openmachine"
dynamic = ["version"]
description = "The Code access launcher that Open Machine SSH sessions run through."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic==2.13.5"]

[tool.hatch.build.targets.wheel]
packages = ["openmachine"]

[tool.hatch.build.targets.sdist]
include = ["/openmachine", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.hatch.version]
path = "openmachine/__init__.py"
